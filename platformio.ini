; ============================================================
;  Часы + метеостанция: ESP32-C6-Zero + SSD1322 OLED + BMP280
;
;  ВАЖНО: официальная платформа `espressif32` застряла на
;  Arduino core 2.x и НЕ поддерживает ESP32-C6.
;  Для C6 нужен core 3.x → форк pioarduino.
;  (rgbLedWrite() тоже существует только в core 3.x)
; ============================================================
[platformio]
default_envs = esp32c6

[env:esp32c6]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board     = esp32-c6-devkitc-1
framework = arduino

; ESP32-C6-Zero: 4 МБ флеша (профиль devkitc-1 считает 8 МБ)
board_upload.flash_size = 4MB
; OTA в проекте нет, поэтому и второй app-слот не нужен:
; huge_app даёт один раздел на 3 МБ вместо двух по 1.25 МБ.
; Смена таблицы разделов → первая прошивка после неё только по USB.
board_build.partitions  = huge_app.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize

; C6-Zero: USB-C идёт на нативный USB — иначе Serial в мониторе пуст
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    olikraus/U8g2 @ ^2.35.19
    links2004/WebSockets @ ^2.4.0
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_src_filter = -<*>
test_build_src = false
test_filter = test_native
