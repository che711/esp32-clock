; ============================================================
;  Часы + метеостанция: ESP32-C6-Zero + SSD1322 OLED + BMP280
;
;  ВАЖНО: официальная платформа `espressif32` застряла на
;  Arduino core 2.x и НЕ поддерживает ESP32-C6.
;  Для C6 нужен core 3.x → форк pioarduino.
;  (rgbLedWrite() тоже существует только в core 3.x)
; ============================================================
[platformio]
default_envs = esp32c6

[env:esp32c6]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board     = esp32-c6-devkitc-1
framework = arduino

; ESP32-C6-Zero: 4 МБ флеша (профиль devkitc-1 считает 8 МБ)
board_upload.flash_size = 4MB
; OTA в проекте нет, поэтому и второй app-слот не нужен:
; huge_app даёт один раздел на 3 МБ вместо двух по 1.25 МБ.
; Смена таблицы разделов → первая прошивка после неё только по USB.
;
; partitions.csv — байт в байт huge_app.csv из ядра. Своя копия нужна
; гибридной сборке (custom_sdkconfig ниже): её часть на IDF ищет таблицу
; в корне проекта и о встроенных таблицах Arduino не знает. Переезду на
; IDF эта копия тоже нужна (IDF_MIGRATION.md, шаг 1).
board_build.partitions  = partitions.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize

; web/index.html → gzip-массив в $BUILD_DIR/generated/web_ui_gz.h;
; git describe и время сборки → $BUILD_DIR/generated/fw_version.h
extra_scripts =
    pre:scripts/gen_web_ui.py
    pre:scripts/gen_version.py

; C6-Zero: USB-C идёт на нативный USB — иначе Serial в мониторе пуст
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Предупреждения — только на свой код: build_flags применился бы и к
; фреймворку с либами, а там сотни -Wmissing-field-initializers, среди
; которых своё уже не разглядеть.
build_src_flags =
    -Wall
    -Wextra

; Автоматический light sleep. В готовых библиотеках ядра CONFIG_PM_ENABLE
; выключен, и esp_pm_configure() отвечает ESP_ERR_NOT_SUPPORTED, поэтому
; pioarduino пересобирает их с этими опциями сам: скачивает framework-espidf
; нужной версии в ~/.platformio. Своя копия IDF в ~/esp для этого не нужна —
; «Короткий путь» в IDF_MIGRATION.md предполагал её напрасно. Первая сборка
; после смены этого списка идёт долго: библиотеки ядра собираются заново.
; Временная мера до переезда на чистый IDF (IDF_MIGRATION.md).
;
; USJ_NO_AUTO_LS_ON_CONNECTION — пока USB подключён к компьютеру, сна нет:
; USB-Serial-JTAG в light sleep не работает, и монитор замолкал бы на первой
; же паузе цикла. Подключение IDF распознаёт по SOF-кадрам хоста, а у зарядки
; их нет — от блока питания часы спят как от банки. Проверка висит на тике
; FreeRTOS и лишних пробуждений не добавляет.
custom_sdkconfig =
    CONFIG_PM_ENABLE=y
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_ESP_WIFI_SLP_BEACON_LOST_OPT=y
    CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION=y
; Компоненты для библиотек ядра гибридная сборка берёт из реестра по
; «^версии» из idf_component.yml ядра, и esp-modbus приезжает свежее, чем
; ядро рассчитывало: его static_assert на CONFIG_FMB_MASTER_* с sdkconfig
; ядра не сходится. Ни ядру, ни проекту modbus не нужен — убираем.
custom_component_remove =
    espressif/esp-modbus

; Версии закреплены точно, а не «^»: с кареткой CI на чистом кеше соберёт то,
; что вышло сегодня, и упавшая сборка окажется не про наш код. Так уже
; разъезжалось — у links2004/WebSockets (её больше нет, WebSocket теперь из
; esp_http_server) просили от 2.4.0, приехала 2.7.3. Обновление версии
; теперь отдельная правка: пересобрать и проверить на плате.
lib_deps =
    olikraus/U8g2 @ 2.36.18
    adafruit/Adafruit BMP280 Library @ 2.6.8
    adafruit/Adafruit Unified Sensor @ 1.1.15
    knolleary/PubSubClient @ 2.8

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; корень проекта нужен test_lint: каталог запуска тестового бинарят 
    ; выбирает PlatformIO, и полагаться на него нельзя. Отдельной переменной
    ; под корень у PlatformIO нет, поэтому отсчитываем от src/.
    -DPROJECT_ROOT=\"${platformio.src_dir}/..\"
build_src_filter = -<*>
test_build_src = false
; test_lint — прогон cppcheck тем же скриптом, что и в CI
test_filter = test_native, test_lint

