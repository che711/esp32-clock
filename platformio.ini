[platformio]
default_envs = esp32-c3-super-mini

[env:esp32-c3-super-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_deps =
    olikraus/U8g2@^2.35.19
    links2004/WebSockets@^2.4.0
monitor_speed = 115200
; ESP32-C3 Super Mini: USB-C идёт на нативный USB (USB Serial/JTAG).
; Без этих флагов Serial уходит в UART0 и в мониторе пусто.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -D CONFIG_ARDUINO_SELECTIVE_COMPILATION=1
    -D CONFIG_ARDUINO_ETH_ENABLED=0
    -std=gnu++17
    -Wall
    -Wextra
build_src_filter = -<*>
test_build_src = false
test_filter = test_native
