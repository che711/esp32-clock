name: CI

# Собираем каждую ветку, а не только main/develop: иначе поломка доезжает
# до PR (так и уехало переименование окружения esp32-c3-super-mini → esp32c6).
on:
  push:
    branches: [ '**' ]
  pull_request:

# Новый пуш в ветку отменяет ещё не закончившийся прогон по старому коммиту.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Native Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-native-

      - name: Install PlatformIO
        run: pip install platformio

      # cppcheck нужен тесту test_lint: без него тот пропускает себя, и
      # статический анализ в CI не выполнялся бы вовсе. Отдельной работы
      # Lint больше нет — проверка живёт там же, где остальные тесты,
      # и запускается тем же scripts/lint.sh, что и локально.
      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run native tests
        run: pio test -e native --verbose

  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    needs: test
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-esp32-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-esp32-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e esp32c6

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/esp32c6/firmware.bin
            .pio/build/esp32c6/firmware.elf
          retention-days: 30
