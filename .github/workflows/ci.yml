name: CI

# Собираем каждую ветку, а не только main/develop: иначе поломка доезжает
# до PR (так и уехало переименование окружения esp32-c3-super-mini → esp32c6).
on:
  push:
    branches: [ '**' ]
  pull_request:

# Новый пуш в ветку отменяет ещё не закончившийся прогон по старому коммиту.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Native Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-native-

      # Версия ядра закреплена под платформу pioarduino 55.03.39. PlatformIO
      # 6.2 хочет SCons 4.11, платформа для гибридной сборки (custom_sdkconfig
      # в platformio.ini) ставит в тот же каталог свой 4.8.1, и посреди сборки
      # они затирают друг друга: линковка падает на пропавшем модуле SCons.
      # 6.1.19 закрепляет тот же 4.8.1, что и платформа. Поднимать — вместе
      # с платформой, проверив гибридную сборку.
      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      # cppcheck нужен тесту test_lint: без него тот пропускает себя, и
      # статический анализ в CI не выполнялся бы вовсе. Отдельной работы
      # Lint больше нет — проверка живёт там же, где остальные тесты,
      # и запускается тем же scripts/lint.sh, что и локально.
      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run native tests
        run: pio test -e native --verbose

  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    needs: test
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-esp32-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-esp32-

      # Ядро закрепляем в ~/.platformio/penv, а не в системном Python:
      # гибридная сборка (custom_sdkconfig) после библиотек IDF запускает
      # вложенный `pio run` из penv, а туда платформа ставит свой форк ядра
      # `pioarduino>=6.1.19` без верхней границы. На свежем penv приезжал
      # 6.2.0, и вложенная сборка падала на том же конфликте SCons, что
      # описан в test, — пин в системном Python её не касался. Если в penv
      # уже есть 6.1.19, платформа его не трогает. --clear — чтобы penv из
      # кеша со старым ядром или другой версией Python не пережил пин.
      - name: Install PlatformIO
        run: |
          python3 -m venv --clear ~/.platformio/penv
          ~/.platformio/penv/bin/pip install pioarduino==6.1.19
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"

      - name: Build firmware
        run: pio run -e esp32c6

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/esp32c6/firmware.bin
            .pio/build/esp32c6/firmware.elf
          retention-days: 30
